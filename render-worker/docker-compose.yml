services:
  render-worker:
    build:
      context: ..
      dockerfile: render-worker/Dockerfile
    container_name: reelforge-render-worker
    restart: always
    env_file: .env
    # Chromium needs a bit of shared memory
    shm_size: "1gb"
    expose:
      - "8787"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set in render-worker/.env}"
      # Router (HTTPS)
      - "traefik.http.routers.reelforge-render.rule=Host(`${RENDER_HOST:?RENDER_HOST must be set in render-worker/.env}`)"
      - "traefik.http.routers.reelforge-render.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.reelforge-render.tls=true"
      - "traefik.http.routers.reelforge-render.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.reelforge-render.service=reelforge-render"
      # Service
      - "traefik.http.services.reelforge-render.loadbalancer.server.port=8787"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
